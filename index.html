<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .fallback {
            padding: 20px;
            text-align: center;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #0366d6;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- แสดงไฟล์ Resume.pdf แบบเต็มหน้าจอ (คำนึงถึงตัวพิมพ์เล็ก-ใหญ่ตามชื่อไฟล์ Resume.pdf) -->
    <iframe src="Resume.pdf" type="application/pdf">
        <div class="fallback">
            <p>เบราว์เซอร์ของคุณไม่รองรับการแสดงผลไฟล์ PDF โดยตรง</p>
            <a href="Resume.pdf" class="btn" download>คลิกที่นี่เพื่อดาวน์โหลดเรซูเม่ (PDF)</a>
        </div>
    </iframe>
</body>
</html>
